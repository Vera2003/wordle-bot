version: '3.8'

x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  BOT_TOKEN: ${BOT_TOKEN}
  ADMIN_IDS: ${ADMIN_IDS:-[]}
  APP_HOST: ${APP_HOST:-0.0.0.0}
  APP_PORT: ${APP_PORT:-8000}
  
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-genetic_wordle}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DB: 0
  
  MAX_ATTEMPTS: ${MAX_ATTEMPTS:-6}
  DAILY_ENERGY: ${DAILY_ENERGY:-5}
  ENERGY_PER_ATTEMPT: ${ENERGY_PER_ATTEMPT:-1}
  ENERGY_PER_HINT: ${ENERGY_PER_HINT:-2}
  BONUS_ENERGY: ${BONUS_ENERGY:-3}

services:
  # Telegram Bot
  bot:
    build:
      context: ..
      dockerfile: ci-cd-files/Dockerfile
      target: production
    container_name: genetic-wordle-bot
    command: python -m src.app.bot.main
    environment: *app-env
    volumes:
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # FastAPI Admin Panel
  api:
    build:
      context: ..
      dockerfile: ci-cd-files/Dockerfile
      target: production
    container_name: genetic-wordle-api
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: *app-env
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ../src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: genetic-wordle-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genetic_wordle}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-genetic_wordle}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  # Redis Cache & FSM Storage
  redis:
    image: redis:7-alpine
    container_name: genetic-wordle-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network

  # PgAdmin (опционально, для управления БД)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: genetic-wordle-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - app-network
    profiles:
      - tools

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  pgadmin-data:
    driver: local

networks:
  app-network:
    driver: bridge
