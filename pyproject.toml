[tool.poetry]
name = "genetic-wordle-bot"
version = "0.1.0"
description = "Telegram bot for learning genes through Wordle game"
authors = ["Vera Mitrofanova mitrofanovavera416@gmail.com"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
aiogram = "^3.19.0"
fastapi = "^0.115.11"
uvicorn = "^0.34.0"
sqlalchemy = "^2.0.29"
asyncpg = "^0.30.0"
alembic = "^1.12.1"
redis = "^5.2.1"
aioredis = "^2.0.1"
pydantic = "^2.10.0"
pydantic-settings = "^2.8.1"
dependency-injector = "^4.46.0"
python-dotenv = "^1.0.1"
httpx = "^0.27.0"
prometheus-fastapi-instrumentator = "^7.1.0"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
isort = "^5.13.2"
flake8 = "^7.1.1"
pre-commit = "^3.8.0"
pytest = "^8.3.2"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
