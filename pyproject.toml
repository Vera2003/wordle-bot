[tool.poetry]
name = "genetic-wordle-bot"
version = "0.1.0"
description = "Telegram bot for learning genes"
authors = ["Bot <bot@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
aiogram = "^3.4.0"
fastapi = "0.109.0"
uvicorn = {extras = ["standard"], version = "^0.40.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.45"}
asyncpg = "^0.31.0"
alembic = "^1.18.1"
pydantic = "^2.12.5"
pydantic-settings = "^2.12.0"
redis = {extras = ["hiredis"], version = "^7.1.0"}
aiohttp = "^3.13.3"
python-dotenv = "^1.2.1"
prometheus-fastapi-instrumentator = "^7.1.0"
structlog = "^24.1.0"
openai = "^2.24.0"

[tool.poetry.group.dev.dependencies]
black = "^24.1.1"
isort = "^5.13.2"
pytest = "^8.0.0"
flake8 = "^7.3.0"
mypy = "^1.19.1"
pytest-asyncio = "^1.3.0"
aiosqlite = "^0.22.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
