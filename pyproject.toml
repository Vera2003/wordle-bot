[project]
name = "genetic-wordle-bot"
version = "0.1.0"
description = "Telegram bot for learning genes"
authors = [{name = "Bot", email = "bot@example.com"}]
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiogram>=3.4.0,<4",
    "fastapi==0.109.0",
    "uvicorn[standard]>=0.40.0,<1",
    "sqlalchemy[asyncio]>=2.0.45,<3",
    "asyncpg>=0.31.0,<1",
    "alembic>=1.18.1,<2",
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.12.0,<3",
    "redis[hiredis]>=7.1.0,<8",
    "aiohttp>=3.13.3,<4",
    "python-dotenv>=1.2.1,<2",
    "prometheus-fastapi-instrumentator>=7.1.0,<8",
    "structlog>=24.1.0,<25",
    "openai>=2.24.0,<3",
]

[dependency-groups]
dev = [
    "black>=24.1.1,<25",
    "isort>=5.13.2,<6",
    "pytest>=8.0.0,<9",
    "flake8>=7.3.0,<8",
    "mypy>=1.19.1,<2",
    "pytest-asyncio>=1.3.0,<2",
    "aiosqlite>=0.22.1,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
