# .github/workflows/deploy.yml
name: CI/CD

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - stage
  workflow_dispatch:  # позволяет запустить вручную из GitHub UI

concurrency:
  group: ci-cd-stage
  cancel-in-progress: true  # отменяем старый деплой если пришёл новый

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Тесты
  # ──────────────────────────────────────────────────────────
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.2

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: poetry run pytest -v --tb=short
        env:
          ENVIRONMENT: testing
          BOT_TOKEN: test_token
          POSTGRES_HOST: localhost
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_pass
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          ADMIN_API_KEY: test_key

  # ──────────────────────────────────────────────────────────
  # JOB 2: Билд и пуш образа в Docker Hub
  # ──────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: test  # запускается только если тесты прошли
    environment: production

    outputs:
      # Передаём только тег (без чувствительных частей)
      app_tag: ${{ steps.vars.outputs.app_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image variables
        id: vars
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        run: |
          USERNAME_LOWER=$(echo "$REGISTRY_USERNAME" | tr '[:upper:]' '[:lower:]')
          # Репозиторий образа: docker.io/yourusername/genetic-wordle
          echo "image_repo=docker.io/${USERNAME_LOWER}/genetic-wordle" >> "$GITHUB_OUTPUT"
          # Тег: sha коммита для точной версии + latest для удобства
          echo "app_tag=app-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci-cd-files/Dockerfile
          target: production
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Два тега: точный (sha) и latest
          tags: |
            ${{ steps.vars.outputs.image_repo }}:${{ steps.vars.outputs.app_tag }}
            ${{ steps.vars.outputs.image_repo }}:latest
          # Кэширование слоёв — ускоряет повторные билды
          cache-from: type=registry,ref=${{ steps.vars.outputs.image_repo }}:buildcache
          cache-to: type=registry,ref=${{ steps.vars.outputs.image_repo }}:buildcache,mode=max

  # ──────────────────────────────────────────────────────────
  # JOB 3: Деплой на сервер
  # ──────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Validate secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          APP_DIR: ${{ secrets.APP_DIR }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -eu
          missing=""
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY APP_DIR REGISTRY_USERNAME REGISTRY_PASSWORD; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "❌ Missing secrets:$missing"
            exit 1
          fi
          echo "✅ All secrets present"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: docker.io
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          APP_TAG: ${{ needs.build-and-push.outputs.app_tag }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          debug: true
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          request_pty: true
          script_stop: true
          envs: REGISTRY,REGISTRY_USERNAME,REGISTRY_PASSWORD,APP_TAG,DEPLOY_SHA
          script: |
            echo "=== remote deploy start $(date) ==="
            set -eux
            APP_DIR="${{ secrets.APP_DIR }}"
            cd "$APP_DIR"

            echo "APP_IMAGE(raw)='${APP_IMAGE-}'"
            echo "APP_TAG(raw)='${APP_TAG-}'"

            USERNAME_LOWER=$(echo "$REGISTRY_USERNAME" | tr '[:upper:]' '[:lower:]')
            : "${APP_IMAGE:=docker.io/${USERNAME_LOWER}/genetic-wordle}"
            : "${APP_TAG:=latest}"

            echo "APP_IMAGE='$APP_IMAGE'"
            echo "APP_TAG='$APP_TAG'"
            echo "Using image: $APP_IMAGE:$APP_TAG"

            echo "🔎 Docker versions"
            docker --version
            docker compose version

            echo "📥 Pulling latest code..."
            git fetch --all --prune
            git checkout stage
            git reset --hard origin/stage

            echo "🔐 Logging into Docker Hub..."
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" \
              -u "$REGISTRY_USERNAME" --password-stdin

            echo "🧷 Pulling exact image tag: ${APP_IMAGE}:${APP_TAG}"
            docker pull "${APP_IMAGE}:${APP_TAG}"
            PULLED_IMAGE_ID=$(docker image inspect "${APP_IMAGE}:${APP_TAG}" --format='{{.Id}}')
            PULLED_IMAGE_REV=$(docker image inspect "${APP_IMAGE}:${APP_TAG}" --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}')
            echo "Pulled image ID: ${PULLED_IMAGE_ID}"
            echo "Pulled image revision label: ${PULLED_IMAGE_REV}"
            if [ -z "${PULLED_IMAGE_REV}" ]; then
              echo "❌ Pulled image has no revision label"
              exit 1
            fi
            if [ "${PULLED_IMAGE_REV}" != "${DEPLOY_SHA}" ]; then
              echo "❌ Pulled image revision ${PULLED_IMAGE_REV} != deploy sha ${DEPLOY_SHA}"
              exit 1
            fi

            echo "📦 Validating resolved compose image..."
            RESOLVED_IMAGE=$(APP_IMAGE="$APP_IMAGE" APP_TAG="$APP_TAG" docker compose -f ci-cd-files/docker-compose.registry.yml config | awk '/^[[:space:]]*image:[[:space:]]/{print $2; exit}')
            echo "Resolved compose image: ${RESOLVED_IMAGE}"
            if [ "${RESOLVED_IMAGE}" != "${APP_IMAGE}:${APP_TAG}" ]; then
              echo "❌ Compose resolved image mismatch"
              exit 1
            fi

            echo "🗄️ Starting postgres and redis..."
            # APP_IMAGE и APP_TAG передаём чтобы не было warnings
            APP_IMAGE="$APP_IMAGE" APP_TAG="$APP_TAG" \
              docker compose -f ci-cd-files/docker-compose.registry.yml up -d postgres redis

            echo "⏳ Waiting for postgres to be healthy..."
            POSTGRES_READY=0
            for i in $(seq 1 25); do
              PG_STATUS=$(docker inspect genetic-wordle-postgres --format='{{.State.Health.Status}}' 2>/dev/null || true)
              echo "  postgres health: ${PG_STATUS:-unknown} (attempt $i/25)"
              if [ "${PG_STATUS}" = "healthy" ]; then
                POSTGRES_READY=1
                break
              fi
              sleep 3
            done
            if [ "$POSTGRES_READY" -ne 1 ]; then
              echo "❌ Postgres did not become healthy in time"
              docker logs --tail 80 genetic-wordle-postgres || true
              exit 1
            fi

            echo "🔄 Restarting api container..."
            APP_IMAGE="$APP_IMAGE" APP_TAG="$APP_TAG" \
              docker compose -f ci-cd-files/docker-compose.registry.yml up -d --pull always --remove-orphans --force-recreate api

            echo "🧾 Verifying running api image..."
            API_IMAGE_ID=$(docker inspect genetic-wordle-api --format='{{.Image}}')
            echo "Running api image ID: ${API_IMAGE_ID}"
            if [ "${API_IMAGE_ID}" != "${PULLED_IMAGE_ID}" ]; then
              echo "❌ API container is not running pulled image"
              exit 1
            fi

            BOT_EXISTS=$(docker ps -a --format '{{.Names}}' | awk 'BEGIN{found="no"} $0=="genetic-wordle-bot"{found="yes"} END{print found}')
            if [ "$BOT_EXISTS" = "yes" ]; then
              echo "🤖 Restarting bot container..."
              APP_IMAGE="$APP_IMAGE" APP_TAG="$APP_TAG" \
                docker compose -f ci-cd-files/docker-compose.registry.yml --profile polling up -d --force-recreate bot
              BOT_IMAGE_ID=$(docker inspect genetic-wordle-bot --format='{{.Image}}')
              echo "Running bot image ID: ${BOT_IMAGE_ID}"
              if [ "${BOT_IMAGE_ID}" != "${PULLED_IMAGE_ID}" ]; then
                echo "❌ Bot container is not running pulled image"
                exit 1
              fi
            else
              echo "ℹ️ Bot container not found, skipping bot restart"
            fi

            echo "🧬 Running DB init (skips if already exists)..."
            APP_IMAGE="$APP_IMAGE" APP_TAG="$APP_TAG" \
              docker compose -f ci-cd-files/docker-compose.registry.yml exec -T api \
              python scripts/init_genes.py || echo "⚠️ Init skipped or already done"

            echo "🧹 Cleaning old images..."
            docker image prune -f

            echo "📊 Container status:"
            APP_IMAGE="$APP_IMAGE" APP_TAG="$APP_TAG" \
              docker compose -f ci-cd-files/docker-compose.registry.yml ps

            echo "✅ Deploy complete! SHA: ${DEPLOY_SHA}"